name: unicode-only-test
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe/unicode-paths
      - name: Remove normal file, keep only Unicode paths
        run: |
          git rm src/normal.py || true
          git config user.name "test-bot"
          git config user.email "test@test.com"
          git commit -m "remove normal file - keep only unicode paths" || true
          git push origin probe/unicode-paths
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
